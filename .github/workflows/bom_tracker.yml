name: Live Procurement BOM Tracker

on:
  schedule:
    # Run daily at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force vendor scrape and JSON commit'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  track-prices:
    name: Sync Live BOM Distributor Prices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4

      - name: Run BOM Live Tracker
        run: |
          python scripts/bom_tracker.py

      - name: Commit and Push Updated Procurement Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/procurement_bom.json data/procurement_bom.json
          if git diff --staged --quiet; then
            echo "No price delta detected. Data is current."
          else
            git commit -m "chore(procurement): update live BOM vendor prices [skip ci]"
            git push
          fi
